services:
  bridge:
    image: vcf-ai-openai-bridge:1.0.0-rc1
    build:
      context: .
      target: final
    env_file:
      - path: .env
        format: raw
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${PUBLIC_PORT:-8443}:8443"
    user: "${CONTAINER_UID:-1000}:${CONTAINER_GID:-1000}"
    volumes:
      - ./certs:/certs:ro
      - ./ca:/ca:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16777216,mode=1777
    mem_limit: 512m
    pids_limit: 100
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "/app/tools/probe.py", "--health-only", "--container"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 20s
